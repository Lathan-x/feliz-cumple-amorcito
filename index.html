<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz cumpleaños amorcito ♥️</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap">
<style>
:root{--rose:#ff2d95;--ink:#ffe3ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 8%,#ffd9ea,#ff9ec4 50%,#a8286a);font-family:Quicksand,system-ui,sans-serif;color:var(--ink);touch-action:none}
.wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;z-index:5;overflow-y:auto;touch-action:pan-y;pointer-events:none}
.wrap>*{pointer-events:auto}
.wrap>.heart{pointer-events:none}
.heart{position:relative;width:min(92vw,400px);aspect-ratio:100/90;flex:none}
.heart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 3px #ff2d95) drop-shadow(0 0 10px #ff2d95) drop-shadow(0 0 22px #ff2d95);animation:beat 2.6s ease-in-out infinite}
.heart svg path{fill:#2a0a1cf2;stroke:#ff7ab8;stroke-width:1.3}
@keyframes beat{0%,40%,100%{transform:scale(1)}8%{transform:scale(1.03)}16%{transform:scale(1)}24%{transform:scale(1.022)}}
.inh{position:absolute;left:18%;right:18%;top:20%;bottom:24%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
h1{font-family:Pacifico,cursive;font-weight:400;color:#fff;font-size:clamp(1.45rem,7vw,2.15rem);line-height:1.2;margin:0 0 8px;text-shadow:0 0 4px #fff,0 0 12px #ff2d95,0 0 26px #ff2d95,0 0 44px #ff2d95;animation:fl 4s infinite}
#ph{margin:0;font-size:.92rem;font-weight:700;min-height:2.6em;color:#ffd0e5;transition:opacity .6s}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(92vw,400px);flex:none}
button{font:700 .92rem Quicksand,sans-serif;color:#fff;background:#2a0a1c;border:2px solid #ff5fa8;border-radius:999px;padding:10px 8px;cursor:pointer;box-shadow:0 0 8px #ff2d95,inset 0 0 8px #ff2d9555;text-shadow:0 0 6px #ff2d95}
.chips button:nth-child(3n+2){border-color:#c77dff;box-shadow:0 0 8px #a855f7,inset 0 0 8px #a855f755;text-shadow:0 0 6px #a855f7}
.chips button:nth-child(3n){border-color:#7df9ff;box-shadow:0 0 8px #22d3ee,inset 0 0 8px #22d3ee55;text-shadow:0 0 6px #22d3ee}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.cap{font-size:.8rem;font-weight:700;color:#fff;text-shadow:0 0 6px #a8286a,0 1px 2px #0006;text-align:center;flex:none}
.d{position:absolute;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;z-index:3;filter:drop-shadow(0 4px 5px #0003)}
.d:active{z-index:9}
.d img{display:block;width:100%;pointer-events:none;-webkit-user-drag:none}
.d.neon{filter:none}
.d.neon svg{width:100%;display:block;overflow:visible}
.nt{font-family:Pacifico,cursive;font-size:1.7rem;white-space:nowrap;color:#fff}
.em{font-size:38px;line-height:1}
.in{display:block;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes fl{0%,92%,100%{opacity:1}94%{opacity:.75}96%{opacity:1}98%{opacity:.8}}
.fall{position:fixed;top:-40px;pointer-events:none;z-index:30;animation:f linear forwards;font-size:24px}
@keyframes f{to{transform:translateY(110vh) rotate(360deg)}}
.rise{position:fixed;bottom:-30px;pointer-events:none;z-index:2;animation:ri linear forwards;color:#ff2d55;text-shadow:0 0 8px #ff2d9588}
@keyframes ri{to{transform:translateY(-115vh) translateX(25px)}}
.tw{position:fixed;font-size:16px;pointer-events:none;z-index:1;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.15;transform:scale(.6)}}
.pop{position:fixed;pointer-events:none;z-index:40;font-size:20px}
#m{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:18px;background:#0007}
#m.on{display:flex}
.paper{background:#1a0612;border:2px solid #ff5fa8;box-shadow:0 0 18px #ff2d95,inset 0 0 18px #ff2d9544;border-radius:26px;padding:20px 18px;width:min(92vw,440px);max-height:88vh;overflow:auto;text-align:center;touch-action:pan-y}
.paper h2{font-family:Pacifico,cursive;font-weight:400;color:#fff;margin:0 0 10px;font-size:1.6rem;text-shadow:0 0 5px #fff,0 0 14px #ff2d95,0 0 30px #ff2d95}
.paper p{margin:0 0 14px;color:#ffd9ea;font-weight:500;line-height:1.45}
.paper img{max-width:100%;max-height:40vh;margin-bottom:10px;filter:drop-shadow(0 0 10px #ff2d9566)}
.neon-t{font-family:Pacifico,cursive;font-size:2.4rem;line-height:1.2;margin:6px 0 14px;color:#fff;text-shadow:0 0 5px #fff,0 0 14px #ff2d95,0 0 30px #ff2d95,0 0 50px #ff2d95;animation:fl 4s infinite}
.paper .sub{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 14px}
.paper .sub button:nth-child(3n+2){border-color:#c77dff;box-shadow:0 0 8px #a855f7,inset 0 0 8px #a855f755;text-shadow:0 0 6px #a855f7}
.paper .sub button:nth-child(3n){border-color:#7df9ff;box-shadow:0 0 8px #22d3ee,inset 0 0 8px #22d3ee55;text-shadow:0 0 6px #22d3ee}
.nav{display:flex;gap:10px;justify-content:center}
.nav button[hidden]{display:none}
#toast{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:45;width:min(86vw,420px);text-align:center;pointer-events:none;font-family:Pacifico,cursive;font-size:1.9rem;line-height:1.3;color:#fff;text-shadow:0 0 5px #fff,0 0 14px #ff2d95,0 0 30px #ff2d95,0 0 50px #ff2d95;animation:fl 4s infinite}
@media (prefers-reduced-motion:reduce){.fall,.tw,.rise,.pop{display:none}.in,h1,.neon-t,.heart svg{animation:none}}
</style></head>
<body>
<div id="stage"></div>
<div class="wrap">
 <div class="heart">
  <svg viewBox="0 0 100 90" aria-hidden="true"><path d="M50 86 C12 57 4 36 4 24 C4 11 14 3 26 3 C37 3 46 9 50 18 C54 9 63 3 74 3 C86 3 96 11 96 24 C96 36 88 57 50 86Z"/></svg>
  <div class="inh"><h1>Feliz cumpleaños mi amorcito</h1><p id="ph">Eres mi lugar favorito ♥️</p></div>
 </div>
 <div class="chips">
  <button data-k="feliz">Feliz cumpleaños 🥳</button>
  <button data-k="carta">Mi carta 💌</button>
  <button data-k="pastel">Tu pastel 🎂</button>
  <button data-k="mas">Más para ti 😻</button>
 </div>
 <div class="cap">Mueve los adornos con el dedo y toca la pantalla ♥️</div>
</div>
<div id="m"><div class="paper"><div id="mc"></div><div class="nav"><button id="bk" hidden>Volver</button><button id="x">Cerrar</button></div></div></div>
